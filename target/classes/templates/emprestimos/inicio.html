<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Empréstimos - Sistema de Biblioteca</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { background: #eee; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
        nav a:hover { color: #0056b3; }
        .btn { display: inline-block; padding: 8px 15px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <h1 th:text="'Sistema de Biblioteca'"></h1>
        <nav>
            <a th:href="@{/livros}">Livros</a>
            <a th:href="@{/autores}">Autores</a>
            <a th:href="@{/categorias}">Categorias</a>
            <a th:href="@{/usuarios}">Usuários</a>
            <a th:href="@{/emprestimos}">Empréstimos</a>
        </nav>
    </header>
    
    <main>
        <h2>Gerenciamento de Empréstimos</h2>
        <p>Controle as saídas e devoluções de livros nesta seção.</p>
        <a th:href="@{/emprestimo}" class="btn">Registrar Novo Empréstimo</a>
    </main>
</body>
</html>
