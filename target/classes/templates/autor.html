<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Autor - Sistema de Biblioteca</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        header { background: #fff; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ddd; }
        nav a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
        nav a:hover { color: #0056b3; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 24px; border: 1px solid #ddd; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px 8px; border-bottom: 1px solid #eee; }
        td:first-child { width: 180px; font-weight: bold; color: #444; }
        ul { margin: 10px 0 0 20px; }
        .btn-voltar { display: inline-block; margin-top: 20px; padding: 8px 15px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; }
        .btn-voltar:hover { background: #5a6268; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a th:href="@{/livros}">Livros</a>
            <a th:href="@{/autores}">Autores</a>
            <a th:href="@{/categorias}">Categorias</a>
            <a th:href="@{/usuarios}">Usuários</a>
            <a th:href="@{/emprestimos}">Empréstimos</a>
        </nav>
    </header>

    <div class="container">
        <h2>Detalhes do Autor</h2>
        <table>
            <tr>
                <td>Nome</td>
                <td th:text="${autor.nome}">Nome do Autor</td>
            </tr>
            <tr>
                <td>Nacionalidade</td>
                <td th:text="${autor.nacionalidade}">Nacionalidade</td>
            </tr>
        </table>

        <h3>Obras publicadas</h3>
        <ul>
            <li th:each="obra : ${autor.obrasPublicadas}" th:text="${obra}">Obra 1</li>
        </ul>

        <a th:href="@{/autores}" class="btn-voltar">← Voltar para Autores</a>
    </div>
</body>
</html>
